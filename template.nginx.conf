# Auto-generated by Lua Config Template Engine
# Date: <%= os.date("%Y-%m-%d %H:%M:%S") %>

upstream <%= server_name %>_cluster {
<% for i, node in ipairs(upstream_nodes) do %>
    server <%= node %> max_fails=3 fail_timeout=10s;
<% end %>
}

server {
    listen <%= port %> <%= ssl_enabled and "ssl http2" or "" %>;
    server_name <%= server_name %>;

    client_max_body_size <%= max_clients %>m;

<% for _, route in ipairs(routes) do %>
    location <%= route.path %> {
        proxy_pass http://<%= route.target %>;
        rate_limit <%= route.rate_limit %>;
    }
<% end %>
}
